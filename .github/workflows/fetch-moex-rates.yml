name: Fetch full MOEX rates

on:
  workflow_dispatch:

  schedule:
    # Every day at 09:00 UTC
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch complete MOEX rates.json
        run: python scripts/fetch_moex_rates.py

      - name: Commit rates.json
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/rates.json

          if git diff --cached --quiet; then
            echo "data/rates.json has not changed"
            exit 0
          fi

          git commit -m "Update full MOEX rates.json"
          git push
